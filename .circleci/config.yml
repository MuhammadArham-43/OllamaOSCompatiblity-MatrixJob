version: 2.1

executors:
  ubuntu-executor:
    docker:
      - image: cimg/python:3.10
    working_directory: ~/ollama-tests

  fedora-executor:
    docker:
      - image: fedora:latest
    working_directory: ~/ollama-tests

  macos-executor:
    macos:
      xcode: "14.2.0"
    working_directory: ~/ollama-tests

jobs:
  test:
    parameters:
      os:
        type: string
    executor:
      name: << parameters.os >>-executor
    steps:
      - checkout

      - when:
          condition:
            or:
              - equal: [<< parameters.os >>, "ubuntu"]
              - equal: [<< parameters.os >>, "fedora"]
          steps:
            - run:
                name: Install Python & deps (Linux)
                command: |
                  if command -v apt-get &> /dev/null; then
                    apt-get update && apt-get install -y python3-pip curl jq
                  elif command -v dnf &> /dev/null; then
                    dnf install -y python3-pip curl jq
                  fi
            
            - run:
                name: Install Ollama (Linux)
                command: |
                  curl -fsSL https://ollama.com/install.sh | sh
                  echo 'export PATH="$HOME/.ollama/bin:$PATH"' >> $BASH_ENV
                  source $BASH_ENV
                  ollama serve &
                  sleep 5

      - when:
          condition:
            equal: [<< parameters.os >>, "macos"]
          steps:
            - run:
                name: Install Homebrew (macOS)
                command: |
                  if ! command -v brew &> /dev/null; then
                    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
                  fi
                  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                  brew install ollama
            
            - run:
                name: Add Homebrew Ollama to PATH
                command: |
                  echo 'export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"' >> $BASH_ENV
                  source $BASH_ENV
                  which ollama
                  ollama --version
            
            - run:
                name: Start Ollama
                command: |
                  ollama serve &
                  sleep 5
      
      - run:
          name: Install Python packages
          command: pip3 install -r requirements.txt
      
      - run:
          name: Pull Ollama Model
          command: ollama pull smollm2:135m
      
      - run:
          name: Run Pytest
          command: pytest ollama-test.py

      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  test-matrix:
    jobs:
      - test:
          matrix:
            parameters:
              os: ["ubuntu", "fedora", "macos"]
