version: 2.1

parameters:
  os:
    type: enum
    default: linux
    enum:
      - linux
      - macos
      - windows

executors:
  linux-executor:
    docker:
      - image: cimg/python:3.10
    working_directory: ~/ollama-tests

  mac-executor:
    macos:
      xcode: "14.2.0"
    working_directory: ~/ollama-tests

  windows-executor:
    machine:
      image: windows-server-2022-gui:current
    shell: cmd.exe /c
    working_directory: ~/ollama-tests

jobs:
  test:
    parameters:
      os:
        type: string
    executor:
      name: << pipeline.parameters.os >>-executor
    steps:
      - checkout

      - when:
          condition:
            not:
              equal: [<< parameters.os >>, "windows"]
          steps:
            - run:
                name: Install Python deps from requirements.txt (Linux/macOS)
                command: |
                  pip install -r requirements.txt

      - when:
          condition:
            equal: [<< parameters.os >>, "windows"]
          steps:
            - run:
                name: Install Python deps from requirements.txt (Windows)
                command: |
                  python -m pip install -r requirements.txt

      - when:
          condition:
            equal: [<< parameters.os >>, "linux"]
          steps:
            - run:
                name: Install system deps + Ollama (Linux)
                command: |
                  sudo apt-get update && sudo apt-get install -y curl jq
                  curl -fsSL https://ollama.com/install.sh | sh
                  echo 'export PATH="$HOME/.ollama/bin:$PATH"' >> $BASH_ENV
                  source $BASH_ENV
                  ollama serve &
                  sleep 5

      - when:
          condition:
            equal: [<< parameters.os >>, "macos"]
          steps:
            - run:
                name: Install Homebrew (macOS)
                command: |
                  # Install Homebrew if it's not installed
                  if ! command -v brew &> /dev/null; then
                    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
                  fi
                  # Add brew to the PATH
                  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                  
                  # Install Ollama after Homebrew is installed
                  brew install ollama
            - run:
                name: Add Homebrew Ollama to PATH
                command: |
                  echo 'export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"' >> $BASH_ENV
                  source $BASH_ENV
                  which ollama
                  ollama --version
            - run:
                name: Start Ollama
                command: |
                  ollama serve &
                  sleep 5

      - when:
          condition:
            equal: [<< parameters.os >>, "windows"]
          steps:
            - run:
                  name: Debug Environment (Windows)
                  command: |
                    echo PATH=%PATH%
                    echo LOCALAPPDATA=%LOCALAPPDATA%
                    echo USERNAME=%USERNAME%
                    echo USERPROFILE=%USERPROFILE%
                    dir
            - run:
                name: Download Ollama Installer (Windows)
                command: |
                  curl -L -o ollama-windows.exe https://ollama.com/download/ollama-windows.exe
            - run:
                name: Install Ollama (Windows)
                command: |
                  start /wait ollama-windows.exe /S
                  timeout /t 20
            - run:
                name: Find and Start Ollama Server (Windows)
                command: |
                  IF EXIST "%LOCALAPPDATA%\Ollama\ollama.exe" (
                    echo Ollama found at: %LOCALAPPDATA%\Ollama\ollama.exe
                    start "" "%LOCALAPPDATA%\Ollama\ollama.exe" serve
                  ) ELSE (
                    echo Ollama not found at expected location, searching...
                    dir /s /b "%LOCALAPPDATA%\ollama.exe"
                    echo If found above, please update the path
                    exit 1
                  )
                  timeout /t 15


      - run:
          name: Run Pytest
          command: pytest ollama-test.py

      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  test-matrix:
    jobs:
      - test:
          matrix:
            parameters:
              os: ["linux", "macos", "windows"]
