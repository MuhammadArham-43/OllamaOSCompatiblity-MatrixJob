version: 2.1

executors:
  ubuntu-executor:
    docker:
      - image: cimg/python:3.10
    working_directory: ~/ollama-tests

  fedora-executor:
    docker:
      - image: fedora:latest
    working_directory: ~/ollama-tests

  macos-executor:
    macos:
      xcode: "14.2.0"
    working_directory: ~/ollama-tests

jobs:
  test:
    parameters:
      os:
        type: string
    executor:
      name: << parameters.os >>-executor
    steps:
      - checkout

      - when:
          condition:
            or:
              - equal: [<< parameters.os >>, "ubuntu"]
              - equal: [<< parameters.os >>, "fedora"]
          steps:
            - run:
                name: Install Python & deps (Linux)
                command: |
                  if command -v apt-get &> /dev/null; then
                    sudo apt-get update && sudo apt-get install -y python3-pip curl jq
                  elif command -v dnf &> /dev/null; then
                    dnf install -y python3-pip curl jq gawk
                  fi
            
            - run:
                name: Install Ollama (Linux)
                command: |
                  curl -fsSL https://ollama.com/install.sh | sh
                  echo 'export PATH="$HOME/.ollama/bin:$PATH"' >> $BASH_ENV
                  source $BASH_ENV

      - when:
          condition:
            equal: [<< parameters.os >>, "macos"]
          steps:
            - run:
                name: Add Homebrew Ollama to PATH
                command: |
                  brew update
                  brew install ollama
                  echo 'export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"' >> $BASH_ENV
                  source $BASH_ENV
                  ollama --version

      # - run:
      #     name: Test Ollama
