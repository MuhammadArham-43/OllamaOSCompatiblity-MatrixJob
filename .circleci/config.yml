version: 2.1

parameters:
  os:
    type: enum
    default: linux-ubuntu
    enum:
      - linux-ubuntu
      - linux-fedora
      - macos-silicon


executors:
  linux-ubuntu-executor:
    docker:
      - image: cimg/python:3.10
    working_directory: ~/ollama-tests

  linux-fedora-executor:
    docker:
      - image: fedora:latest
    working_directory: ~/ollama-tests

  macos-silicon-executor:
    macos:
      xcode: "14.2.0"
    working_directory: ~/ollama-tests

jobs:
  test:
    parameters:
      os:
        type: string
    executor:
      name: << parameters.os >>-executor
    steps:
      - checkout

      - when:
          condition:
            or:
              - equal: [<< parameters.os >>, "linux-ubuntu"]
              - equal: [<< parameters.os >>, "linux-fedora"]
          steps:
            - run:
                name: Install Python & deps (Linux)
                command: |
                  if command -v apt-get &> /dev/null; then
                    sudo apt-get update && sudo apt-get install -y python3-pip curl jq
                  elif command -v dnf &> /dev/null; then
                    dnf install -y python3-pip curl jq gawk
                  fi
            - run:
                name: Install Ollama (Linux)
                command: |
                  curl -fsSL https://ollama.com/install.sh | sh
                  echo 'export PATH="$HOME/.ollama/bin:$PATH"' >> $BASH_ENV
                  source $BASH_ENV
                  ollama serve &
                  sleep 5

      - when:
          condition:
            equal: [<< parameters.os >>, "macos-silicon"]
          steps:
            - run:
                name: Install Homebrew + Ollama (macOS)
                command: |
                  if ! command -v brew &> /dev/null; then
                    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
                  fi
                  eval "$(/opt/homebrew/bin/brew shellenv)"
                  brew install ollama
            - run:
                name: Start Ollama
                command: |
                  echo 'export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"' >> $BASH_ENV
                  source $BASH_ENV
                  which ollama
                  ollama --version
                  ollama serve &
                  sleep 5
      - run:
          name: Install Python dependencies
          command: pip3 install -r requirements.txt
      - run:
          name: Run Pytest
          command: pytest ollama-test.py

      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  test-matrix:
    jobs:
      - test:
          matrix:
            parameters:
              os: ["linux-ubuntu", "linux-fedora", "macos-silicon"]
