version: 2.1

parameters:
  os:
    type: enum
    default: linux
    enum:
      - linux
      - macos
      - windows

executors:
  linux-executor:
    docker:
      - image: cimg/python:3.10
    working_directory: ~/ollama-tests

  mac-executor:
    macos:
      xcode: "14.2.0"
    working_directory: ~/ollama-tests

  windows-executor:
    machine:
      image: windows-server-2022-gui:current
    shell: powershell.exe -ExecutionPolicy Bypass
    working_directory: ~/ollama-tests

jobs:
  test:
    parameters:
      os:
        type: string
    executor:
      name: << pipeline.parameters.os >>-executor
    steps:
      - checkout

      - when:
          condition:
            not:
              equal: [<< parameters.os >>, "windows"]
          steps:
            - run:
                name: Install Python deps from requirements.txt (Linux/macOS)
                command: |
                  pip install -r requirements.txt

      - when:
          condition:
            equal: [<< parameters.os >>, "windows"]
          steps:
            - run:
                name: Install Python deps from requirements.txt (Windows)
                command: |
                  python -m pip install -r requirements.txt

      - when:
          condition:
            equal: [<< parameters.os >>, "linux"]
          steps:
            - run:
                name: Install system deps + Ollama (Linux)
                command: |
                  sudo apt-get update && sudo apt-get install -y curl jq
                  curl -fsSL https://ollama.com/install.sh | sh
                  echo 'export PATH="$HOME/.ollama/bin:$PATH"' >> $BASH_ENV
                  source $BASH_ENV
                  ollama serve &
                  sleep 5

      - when:
          condition:
            equal: [<< parameters.os >>, "macos"]
          steps:
            - run:
                name: Install Homebrew (macOS)
                command: |
                  # Install Homebrew if it's not installed
                  if ! command -v brew &> /dev/null; then
                    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
                  fi
                  # Add brew to the PATH
                  eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
                  
                  # Install Ollama after Homebrew is installed
                  brew install ollama
            - run:
                name: Add Homebrew Ollama to PATH
                command: |
                  echo 'export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"' >> $BASH_ENV
                  source $BASH_ENV
                  which ollama
                  ollama --version
            - run:
                name: Start Ollama
                command: |
                  ollama serve &
                  sleep 5

      - when:
          condition:
            equal: [<< parameters.os >>, "windows"]
          steps:
            - run:
                name: Start Ollama (Windows)
                shell: powershell.exe
                command: |
                  Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
                  Invoke-WebRequest -Uri "https://ollama.com/download/ollama-windows.exe" -OutFile "ollama-windows.exe"
                  
                  # Install Ollama silently
                  Start-Process -FilePath ".\ollama-windows.exe" -ArgumentList "/S" -Wait
                  
                  # Find Ollama executable
                  $ollamaPath = "$env:LOCALAPPDATA\Ollama\ollama.exe"
                  if (Test-Path $ollamaPath) {
                    Write-Host "Ollama found at: $ollamaPath"
                  } else {
                    Write-Host "Ollama not found at expected location. Searching..."
                    $ollamaPath = Get-ChildItem -Path $env:LOCALAPPDATA -Filter "ollama.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
                    if ($ollamaPath) {
                      Write-Host "Ollama found at: $ollamaPath"
                    } else {
                      Write-Error "Ollama installation not found!"
                      exit 1
                    }
                  }
                  
                  # Verify Ollama version
                  & $ollamaPath --version
                  
                  # Start Ollama server
                  Start-Process -NoNewWindow -FilePath $ollamaPath -ArgumentList "serve"
                  
                  # Wait for server to start
                  Write-Host "Waiting for Ollama server to start..."
                  Start-Sleep -Seconds 10

      - run:
          name: Run Pytest
          command: pytest ollama-test.py

      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  test-matrix:
    jobs:
      - test:
          matrix:
            parameters:
              os: ["linux", "macos", "windows"]
